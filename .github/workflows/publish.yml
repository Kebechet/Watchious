name: Publish

# Publishes the 10 Kebechet.Watchious.* packages at the version in Directory.Build.props: to nuget.org with Trusted
# Publishing (no API key: nuget.org trusts this workflow file of this repository), to GitHub Packages, and as the GitHub
# release v<version>. Only by hand ("Run workflow" on main), after the version was bumped and merged. The packages are
# packed and tested by the same reusable workflow as every pull request, and nothing is pushed unless all of it passes.
#
# ⚠️ A package id and a version on nuget.org are permanent: a version can only be unlisted, never deleted or replaced.
#
# The packages go out libraries first, then the SDK that references them at its exact version, then the template that
# names the SDK, so a run that stops halfway never leaves a pushed package that references one that wasn't pushed.
# nuget.org then lists each package on its own, minutes later and not always in that order, so the release waits until
# it lists all 10. Every push skips a version that is already there, so a re-run of a run that stopped halfway ("Re-run
# failed jobs", or "Re-run all jobs") pushes the rest, symbol packages included, from the same commit. ⚠️ A new run of a version is refused once its tag v<version> exists or nuget.org lists any
# Kebechet.Watchious.* package at it, since it would pack the current main next to the packages already pushed: re-run
# the run that stopped, or bump the version. The publish job creates the tag right before its first push, because
# nuget.org lists a pushed package only minutes later, once it has validated and indexed it.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: publish

env:
  # In push order: libraries first, then Sdk, then Templates (see the top).
  PACKAGES: Core Controls Essentials Preview Hosts.watchOS Hosts.WearOS Messaging Health Sdk Templates

jobs:
  refuse-branch:
    name: Refuse a branch other than main
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse
        run: |
          echo "::error::Publish runs only on main, not on $GITHUB_REF. Choose main under 'Use workflow from'."
          exit 1

  version:
    name: Version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read     # the jobs of this run's earlier attempts (the re-run check below)
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from Directory.Build.props
        id: version
        run: |
          set -euo pipefail
          versions="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props)"
          if [ "$(printf '%s\n' "$versions" | sed '/^$/d' | wc -l)" -ne 1 ]; then
            echo "::error::Directory.Build.props must set <Version> exactly once; found: $versions"
            exit 1
          fi
          if ! [[ "$versions" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$versions' in Directory.Build.props is not a version like 1.2.3 or 1.2.3-preview.1."
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"
          echo "Version: $versions"

      # Decided once per run: a re-run, of all jobs or of the failed ones, builds the commit of the run's first attempt,
      # so once an earlier attempt passed this check, the re-run finishes what that attempt began. Without this, "Re-run
      # all jobs" after the first package was pushed would be refused here, and every re-run after it too.
      - name: Refuse a version that is already published
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            # "Version" is the name of this job.
            passed="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" \
              --jq '.jobs[] | select(.name == "Version" and .conclusion == "success" and .run_attempt < (env.GITHUB_RUN_ATTEMPT | tonumber)) | .id')"
            if [ -n "$passed" ]; then
              echo "An earlier attempt of this run passed this check: this re-run finishes that publish of $VERSION, from the same commit."
              exit 0
            fi
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::The tag v$VERSION exists: a Publish run of $VERSION reached its first push. To finish that run, re-run it (Re-run failed jobs); otherwise bump <Version> in Directory.Build.props."
            exit 1
          fi
          # The tag is the check that counts: nuget.org lists a pushed package only once it has validated and indexed
          # it, minutes after the push. This one covers packages pushed without the tag (a tag deleted by hand, a push
          # from elsewhere), for every id, not only the SDK. The flat container lists every version of an id, unlisted
          # ones too, in lower case; an unknown id is a 404.
          version_lower="$(printf '%s' "$VERSION" | tr '[:upper:]' '[:lower:]')"
          published=()
          for package in $PACKAGES; do
            id_lower="$(printf 'kebechet.watchious.%s' "$package" | tr '[:upper:]' '[:lower:]')"
            status="$(curl -sS -o "$RUNNER_TEMP/versions.json" -w '%{http_code}' "https://api.nuget.org/v3-flatcontainer/$id_lower/index.json")"
            case "$status" in
              404) ;;
              200)
                if grep -qF "\"$version_lower\"" "$RUNNER_TEMP/versions.json"; then
                  published+=("Kebechet.Watchious.$package")
                fi
                ;;
              *)
                echo "::error::nuget.org answered $status for the versions of Kebechet.Watchious.$package."
                exit 1
                ;;
            esac
          done
          if [ "${#published[@]}" -gt 0 ]; then
            echo "::error::nuget.org has $VERSION of ${published[*]}. A new run would pack the current main next to them. To finish the run that pushed them, re-run that run (Re-run failed jobs); otherwise bump <Version> in Directory.Build.props."
            exit 1
          fi
          echo "Neither the tag v$VERSION nor any Kebechet.Watchious.* package at $VERSION exists."

  packages:
    name: Packages
    needs: version
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish
    needs: [version, packages]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The wait for nuget.org to list the packages takes up to 45 of these minutes.
    timeout-minutes: 75
    permissions:
      contents: write   # the release and its tag
      packages: write   # GitHub Packages
      id-token: write   # the OIDC token NuGet/login trades for a nuget.org API key
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - name: Check that these are the 10 packages
        run: |
          set -euo pipefail
          for package in $PACKAGES; do
            test -f "packages/Kebechet.Watchious.$package.$VERSION.nupkg" || { echo "::error::No Kebechet.Watchious.$package.$VERSION.nupkg."; exit 1; }
          done
          count="$(find packages -name '*.nupkg' | wc -l)"
          [ "$count" -eq 10 ] || { echo "::error::Expected 10 packages, found $count."; exit 1; }

      # Directly before the push: the API key it returns is valid for 1 hour. The nuget.org policy names this file,
      # publish.yml, so the login must stay in this workflow, not in the reusable one.
      - name: Log in to nuget.org (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Kebechet

      # Before the first push, after the login, so that a failed login (no Trusted Publishing policy yet) leaves no tag.
      # The Version job refuses a new run of this version as soon as the tag exists, while nuget.org shows it the pushed
      # packages only minutes later. A re-run finds the tag at its own commit and goes on.
      - name: Tag the commit v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" \
            --jq '.[] | select(.ref == "refs/tags/v" + env.VERSION) | .ref')"
          if [ -z "$existing" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" > /dev/null
            echo "Tagged $GITHUB_SHA v$VERSION."
            exit 0
          fi
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/v$VERSION" --jq .sha)"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::The tag v$VERSION is at $tagged, not at this run's commit $GITHUB_SHA. Nothing was pushed; bump <Version> in Directory.Build.props."
            exit 1
          fi
          echo "The tag v$VERSION is already at $GITHUB_SHA: this re-run finishes that publish."

      # Each .snupkg is pushed on its own: dotnet nuget push sends the one next to a package only when that package was
      # pushed in the same call, so a re-run, which skips the packages already there, would never send the symbols of
      # a run that stopped between the two.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for package in $PACKAGES; do
            dotnet nuget push "packages/Kebechet.Watchious.$package.$VERSION.nupkg" \
              --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
            symbols="packages/Kebechet.Watchious.$package.$VERSION.snupkg"
            if [ -f "$symbols" ]; then
              dotnet nuget push "$symbols" \
                --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
            fi
          done

      # GitHub Packages has no symbol server.
      - name: Push to GitHub Packages
        env:
          PACKAGES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for package in $PACKAGES; do
            dotnet nuget push "packages/Kebechet.Watchious.$package.$VERSION.nupkg" \
              --api-key "$PACKAGES_TOKEN" --source "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" \
              --skip-duplicate --no-symbols
          done

      # The release announces the version, so it waits until every package can be installed. The flat container lists
      # a version once nuget.org has validated and indexed it, in lower case.
      - name: Wait until nuget.org lists the packages
        run: |
          set -euo pipefail
          version_lower="$(printf '%s' "$VERSION" | tr '[:upper:]' '[:lower:]')"
          deadline=$((SECONDS + 45 * 60))
          for package in $PACKAGES; do
            id_lower="$(printf 'kebechet.watchious.%s' "$package" | tr '[:upper:]' '[:lower:]')"
            until curl -sSf -o "$RUNNER_TEMP/versions.json" "https://api.nuget.org/v3-flatcontainer/$id_lower/index.json" 2> /dev/null \
              && grep -qF "\"$version_lower\"" "$RUNNER_TEMP/versions.json"; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::nuget.org doesn't list Kebechet.Watchious.$package $VERSION after 45 minutes. Everything is pushed: re-run the failed jobs later to create the release."
                exit 1
              fi
              sleep 30
            done
            echo "nuget.org lists Kebechet.Watchious.$package $VERSION."
          done

      - name: Create the GitHub release v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          notes="$(cat <<EOF
          All 10 Kebechet.Watchious.* packages at $VERSION, on [nuget.org](https://www.nuget.org/packages/Kebechet.Watchious.Sdk/$VERSION).

          \`\`\`bash
          dotnet new install Kebechet.Watchious.Templates@$VERSION
          dotnet new watchious
          \`\`\`

          An app names the SDK: \`<Project Sdk="Kebechet.Watchious.Sdk/$VERSION">\`.
          EOF
          )"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "v$VERSION" packages/*.nupkg --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$VERSION" packages/*.nupkg --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "v$VERSION" --notes "$notes" --generate-notes "${prerelease[@]}"
          fi
